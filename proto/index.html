<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hard Five</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
html,body{margin:0;height:100%;}
  body{background:#8E989B;overflow-x:hidden;overflow-y:auto;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  svg.deck{display:block;touch-action:pan-y;
    --i1:#1C1C1C;--i2:#3B3B3B;--i3:#7A7A7A;--rust:.5;--polish:.5;--pa:0;--turns:0;--jaw:-38deg;}
  .jaw{transform-box:view-box;transform-origin:0 0;
       transform:translate(var(--hx),var(--hy)) rotate(calc(-1 * var(--jaw,-38deg))) translate(calc(-1*var(--hx)),calc(-1*var(--hy)));
       transition:transform 180ms cubic-bezier(.2,.9,.3,1.15);}
  .w1{opacity:clamp(0,var(--turns,0),1)}
  .w2{opacity:clamp(0,calc(var(--turns,0) - 1),1)}
  .w3{opacity:clamp(0,calc(var(--turns,0) - 2),1)}
  .w4{opacity:clamp(0,calc(var(--turns,0) - 3),1)}
  .w5{opacity:clamp(0,calc(var(--turns,0) - 4),1)}
  .shadow{fill:#5F6669;opacity:.45}
  .contact{fill:#1d2022;opacity:.5}
  .mottle{mix-blend-mode:overlay;opacity:.5;pointer-events:none}
  .st{font-family:'Allerta Stencil','Stencil',Impact,sans-serif;font-weight:400}
  .cp{font-family:'Courier Prime','Courier New',monospace}
  text{pointer-events:none}
  .hit,.tgt{stroke:none;cursor:pointer;outline:none}
  .hit,.tgt:not(.panelBack){fill:transparent}
  .hit:focus,.hit:focus-visible,.tgt:focus,.tgt:focus-visible{outline:none}
  .tgt.strip{touch-action:none;cursor:ew-resize}
  .xf{transition:opacity 200ms linear}
  .run{will-change:auto}
  .turns,.turnsh{transition:opacity 120ms linear}
  .noanim .jaw,.noanim .xf,.noanim .run,.noanim .turns,.noanim .turnsh{transition:none!important}
  #kbd{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;margin:0;font-size:16px;background:transparent;color:transparent}
</style>
<style id="lapStyle">.lap{--i1:#7D8386;--i2:#A9AFB2;--i3:#C7CBCD}</style>
<svg id="deck" class="deck" xmlns="http://www.w3.org/2000/svg" width="100%" height="844" viewBox="0 0 390 844" preserveAspectRatio="xMidYMin slice">

  <!-- ============================================================
       HARD FIVE LINK SYMBOLS. Phone units: stock d = 6 px. Flat stud link ~37 x 22, opening ~25 x 10.
       Every link is a <use>. Parameters ride in as CSS custom properties on the <use> (they inherit into the symbol):
         --i1 --i2 --i3   iron tones: deep / body / crown highlight   (your run 1C/3B/7A, other runs 2A/4A/8A)
         --rust 0..1      rust bloom opacity (hole corners, fillets, undersides)   --polish 0..1  wear at the crowns
         --paint --pa     boatswain's paint colour and 0/1 switch (85% tinted overlay; shading reads through)
         --turns 0..5     seizing-wire turns on the marker link (lines across the top bar by the left crown)
         --jaw            lap link gate: -38deg sprung open, 0deg closed (animate this; cubic-bezier(.2,.9,.3,1.15) 180ms).
                          The gate is the piece of the C from the stud along the top bar and round the right crown; it is
                          hinged on the crown at -40deg and swings up off the stud, so the gap opens at the stud and the
                          deck shows through it. Hinge coordinates ride in as --hx/--hy set inside the symbol.
       Per-instance variety is the transform on the <use>: rotate 2-6 deg, drift y 1-3 px, and which roll symbol.
       Light: one key upper-left, ~50 deg elevation. Highlight a third in from the lit edge, terminator lower-right,
       reflected light from the deck as a hairline on the far edge. No outline strokes anywhere on iron.
       Deck shadows: a second <use> of the sil-* silhouette in the shadow group, with the sun's shear
       matrix(1,0,K,K,K*z0,K*z0): K = cot(altitude)/sqrt2 (0.5 at 13:00), z0 the link's height off the deck.
       ============================================================ -->

function renderTurn(k, p, rec) {

function grime() {
  // the chain's marks on the deck: a worn drag band under each run (anchored to the link field, never the gutters) and the one rust

  var s = LAY.s, out = '<g id="grime">', k, y, x0 = LAY.connX[0] - 12 * s, x1 = LAY.connX[6] + 16 * s, w = x1 - x0, u = w / 304;

    y = LAY.rowY(k);
    out += '<g opacity="' + (LI.mode === 'day' ? 1 : .7) + '">'
      + '<path d="M' + f(x0) + ',' + f(y - 9 * s) + ' q' + q(60, -4) + ' ' + q(120, -1) + ' t' + q(120, 2) + ' t' + q(60, -3) + ' l' + q(4, 16) + ' q' + q(-60, 5) + ' ' + q(-120, 2) + ' t' + q(-120, -3) + ' t' + q(-64, 1) + 'z" fill="#6a5d54" opacity=".16"/>'
      + '<path d="M' + f(x0 + 22 * u) + ',' + f(y - 4 * s) + ' q' + q(50, -3) + ' ' + q(96, 1) + ' t' + q(92, 1) + ' t' + q(70, -2) + ' l' + q(1, 7) + ' q' + q(-70, 3) + ' ' + q(-140, 0) + ' t' + q(-120, -1) + 'z" fill="#5b5049" opacity=".14"/></g>';
  }
  if (LAY.lap) {
    for (k = 0; k < 5; k++) { y = LAY.rowY(k); out += '<path d="M' + f(LAY.connX[0] - 20) + ',' + f(y - 12) + ' q220,-6 440,-1 l2,22 q-220,7 -444,2z" fill="#6a5d54" opacity=".1"/>'; }
  }
  var rb = LAY.rustBleed;
  out += '<ellipse cx="' + f(rb.x) + '" cy="' + f(rb.y + rb.h / 2) + '" rx="' + f(rb.w / 2) + '" ry="' + f(rb.h / 2) + '" fill="' + C.rust + '" opacity=".35"/>';
  out += '<ellipse cx="' + f(rb.x + 4 * s) + '" cy="' + f(rb.y + rb.h * .62) + '" rx="' + f(rb.w * .62) + '" ry="' + f(rb.h * .5) + '" fill="' + C.rust + '" opacity=".14"/>';

}

function countdownText(d) {
  var mins = Math.max(0, Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1) - d) / 60000)) % 1440;
  return Math.floor(mins / 60) + ':' + pad2(mins % 60);
}

function render() {

  else out.push('<text class="st" x="' + f(LAY.date.x) + '" y="' + f(LAY.date.y) + '" font-size="' + f(LAY.date.size) + '" fill="' + LI.stencil + '">' + dateStr + '</text>');
  out.push(chalkText('cp', LAY.cd.x, LAY.cd.y, LAY.cd.size, 'end', LI.chalk, 1, countdownText(now), ' font-weight="700"'));

  out.push('<rect class="tgt local" x="' + f(LAY.local.x - 60 * s) + '" y="' + f(LAY.local.y - 20 * s) + '" width="' + f(70 * s) + '" height="' + f(30 * s) + '"/>');

function postPass() {
  var s = LAY.s;
  // day counts sit six px after the name; struck counts get one chalk stroke and the new count beside them
  document.querySelectorAll('#scene .run .chalk, #scene .panel .line').forEach(function (g) {
    var name = g.querySelector('[data-role="name"]'); if (!name) return;
    var x = parseFloat(name.getAttribute('x')) + name.getComputedTextLength() + 6 * s;
    var nm = g.querySelector('.tgt.edit[data-field="name"]'), dy = g.querySelector('.tgt.edit[data-field="day"]');
    if (nm) nm.setAttribute('width', f(name.getComputedTextLength() + 10 * s));
    ['count', 'count2'].forEach(function (role) {
      var c = g.querySelector('[data-role="' + role + '"]'); if (!c) return;
      c.setAttribute('x', f(x)); c.setAttribute('transform', 'rotate(' + f((hash(role + x) % 100) / 100 * 2 - 1) + ' ' + f(x) + ' ' + c.getAttribute('y') + ')');
      var w = c.getComputedTextLength();
      if (c.classList.contains('struck')) g.appendChild(strike(x, parseFloat(c.getAttribute('y')), w, parseFloat(c.getAttribute('font-size')), c.getAttribute('fill')));
      if (dy && role === 'count') { dy.setAttribute('x', f(x - 6 * s)); dy.setAttribute('width', f(w + 40 * s)); }
      x += w + 6 * s;
    });
    var times = g.querySelector('.times');
    if (times) {
      var ts = Array.prototype.slice.call(times.querySelectorAll('[data-role="time"]')), rx = parseFloat(ts[0].getAttribute('x'));
      for (var i = ts.length - 1; i >= 0; i--) {
        var t = ts[i], w2 = t.getComputedTextLength(), y = parseFloat(t.getAttribute('y'));
        t.setAttribute('x', f(rx)); t.setAttribute('transform', 'rotate(' + f((hash('t' + i + rx) % 100) / 100 * 2 - 1) + ' ' + f(rx) + ' ' + f(y) + ')');
        if (t.classList.contains('struck')) times.appendChild(strike(rx - w2, y, w2, parseFloat(t.getAttribute('font-size')), t.getAttribute('fill')));
        rx -= w2 + 6 * s;
      }
    }
  });
}
function strike(x, y, w, size, fill) {
  var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', f(x - 2)); l.setAttribute('y1', f(y - size * .3 + 1)); l.setAttribute('x2', f(x + w + 2)); l.setAttribute('y2', f(y - size * .38 - 1));
  l.setAttribute('stroke', fill); l.setAttribute('stroke-width', f(1.5 * LAY.s)); l.setAttribute('stroke-linecap', 'round'); l.setAttribute('opacity', '.9'); l.setAttribute('class', 'strike');
  return l;
}

/* the serpentine: pad-eye to hawsepipe, in layout px */
function serpentine() {
  var d = '', k, y, R = LAY.R, Sg = LAY.S, x0 = LAY.connX[0], x6 = LAY.connX[6];
  d += 'M' + f(x0) + ',' + f(LAY.rowY(0));
  for (k = 0; k < 5; k++) {
    y = LAY.rowY(k);
    if (k % 2 === 0) {
      d += ' L' + f(x6) + ',' + f(y);
      if (k === 4) { d += ' A' + f(R) + ',' + f(R) + ' 0 0 1 ' + f(LAY.apexR) + ',' + f(y + R) + ' L' + f(LAY.apexR) + ',' + f(y + LAY.hawse.dy); }
      else d += ' A' + f(R) + ',' + f(R) + ' 0 0 1 ' + f(LAY.apexR) + ',' + f(y + R) + ' L' + f(LAY.apexR) + ',' + f(y + R + Sg) + ' A' + f(R) + ',' + f(R) + ' 0 0 1 ' + f(x6) + ',' + f(y + 2 * R + Sg);
    } else {
      d += ' L' + f(x0) + ',' + f(y) + ' A' + f(R) + ',' + f(R) + ' 0 0 0 ' + f(LAY.apexL) + ',' + f(y + R) + ' L' + f(LAY.apexL) + ',' + f(y + R + Sg) + ' A' + f(R) + ',' + f(R) + ' 0 0 0 ' + f(x0) + ',' + f(y + 2 * R + Sg);

}
/* arc-length position of every link along the serpentine, keyed by element id */
function chainPositions() {
  var pos = {}, field = LAY.connX[6] - LAY.connX[0], turn = Math.PI * LAY.R + LAY.S, order = slotOrder(today());
  order.forEach(function (p, k) {
    var start = k * (field + turn), dir = LAY.dirOf(k), i;
    for (i = 0; i < 6; i++) pos['lk-' + p.id + '-' + i] = start + (dir > 0 ? LAY.linkX[i] - LAY.connX[0] : LAY.connX[6] - LAY.linkX[i]);
    for (i = 0; i < 7; i++) pos['ek-' + p.id + '-' + i] = start + (dir > 0 ? LAY.connX[i] - LAY.connX[0] : LAY.connX[6] - LAY.connX[i]);
    pos['tr1-' + p.id] = start + field + Math.PI * LAY.R / 4 + 3;
    pos['mk-' + p.id] = start + field + Math.PI * LAY.R / 2 + LAY.S / 2 + (k === 4 ? 6 : 0);
    if (k < 4) pos['tr2-' + p.id] = start + field + Math.PI * LAY.R * 3 / 4 + LAY.S - 3;
  });
  return pos;
}

/* ---------- deck-log panel (the only chrome, hidden behind LOCAL) ---------- */
function renderPanel() {

  out.push('<g class="panel"><rect class="tgt panelBack" x="0" y="' + f(LAY.stripH) + '" width="' + f(LAY.vw) + '" height="' + f(LAY.height - LAY.stripH) + '" style="fill:' + LI.deck + ';fill-opacity:.93"/>');
  S.roster.forEach(function (p, i) {
